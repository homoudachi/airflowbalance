<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Airflow Balancing Tool</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0f1117;
  --surface:  #181c27;
  --surface2: #1e2330;
  --border:   #2a2f3f;
  --border2:  #3a3f52;
  --text:     #e8eaf0;
  --dim:      #8890a8;
  --muted:    #555e78;
  --accent:   #3b82f6;
  --adim:     #1a3464;
  --warn:     #f59e0b;
  --wdim:     #3d2e0a;
  --ok:       #22c55e;
  --okdim:    #0c2e18;
  --danger:   #ef4444;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'Sora', sans-serif;
  --rh:       38px;   /* row height */
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; overflow: hidden; }

/* ── SHELL ── */
.shell { display: flex; flex-direction: column; height: 100dvh; }

/* ── TOPBAR ── */
.topbar {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  padding: 0 10px;
  height: 46px;
  gap: 8px;
}
.brand {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--sans); font-size: 14px; font-weight: 700;
  white-space: nowrap; overflow: hidden;
}
.brand-sub {
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  color: var(--muted); border-left: 1px solid var(--border2);
  padding-left: 8px; margin-left: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-actions { display: flex; gap: 5px; }

/* ── SETTINGS BAR ── */
.settingsbar {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0;
  height: 40px;
  overflow-x: auto;
  scrollbar-width: none;
}
.settingsbar::-webkit-scrollbar { display: none; }
.sb-field {
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px; height: 100%;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.sb-input {
  background: transparent; border: none;
  color: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 500;
  outline: none; min-width: 0;
}
.sb-input.sys { width: 100px; }
.sb-input.spd { width: 36px; text-align: center; }
.sb-input.cf  { width: 42px; text-align: center; display: none; }
.sb-input:focus { color: var(--accent); }

/* rec speed */
.rec-box {
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 10px; height: 100%; border-right: 1px solid var(--border);
  flex-shrink: 0; gap: 0px;
}
.rec-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.rec-val { font-size: 16px; font-weight: 700; color: var(--dim); line-height: 1; }
.rec-val.changed { color: var(--warn); }
.rec-val.ok      { color: var(--ok); }

/* cf toggle */
.cf-wrap {
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px; height: 100%; border-right: 1px solid var(--border);
  cursor: pointer; flex-shrink: 0;
}
.cf-wrap input[type=checkbox] { display: none; }
.pill {
  width: 28px; height: 15px; background: var(--border2);
  border-radius: 8px; position: relative; transition: background .15s; flex-shrink: 0;
}
.pill::after {
  content: ''; position: absolute;
  width: 11px; height: 11px; background: var(--muted);
  border-radius: 50%; top: 2px; left: 2px;
  transition: transform .15s, background .15s;
}
input:checked ~ .pill { background: var(--adim); }
input:checked ~ .pill::after { transform: translateX(13px); background: var(--accent); }
.cf-lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* ── STATS BAR ── */
.statsbar {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.stat {
  padding: 5px 8px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 1px;
}
.stat:last-child { border-right: none; }
.sl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
.sv { font-size: 14px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sv.ok   { color: var(--ok); }
.sv.warn { color: var(--warn); }
.sv.hi   { color: var(--accent); }

/* ── TABLE ── */
.table-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

table { width: 100%; border-collapse: collapse; table-layout: fixed; }

/* Column widths — tuned for ~390px portrait */
col.c-idx  { width: 28px; }
col.c-name { width: auto; }   /* fills remaining */
col.c-req  { width: 68px; }
col.c-cur  { width: 68px; }
col.c-damp { width: 52px; }
col.c-rec  { width: 52px; }
col.c-del  { width: 30px; }

thead { position: sticky; top: 0; z-index: 10; background: var(--surface2); }
th {
  padding: 0 4px; height: 26px;
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--muted);
  border-bottom: 1px solid var(--border2);
  border-right: 1px solid var(--border);
  white-space: nowrap; overflow: hidden;
  text-align: right;
}
th.left { text-align: left; }
th:last-child { border-right: none; }

tbody tr { border-bottom: 1px solid var(--border); height: var(--rh); }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.018); }
tbody tr:hover { background: var(--surface2); }

td {
  padding: 0 4px; height: var(--rh);
  border-right: 1px solid var(--border);
  vertical-align: middle; overflow: hidden;
}
td:last-child { border-right: none; }

.idx { text-align: center; color: var(--muted); font-size: 10px; }

.ci {
  background: transparent; border: none;
  color: var(--text); font-family: var(--mono); font-size: 14px;
  width: 100%; height: 100%; outline: none; padding: 0 2px;
  font-size: 13px;
}
.ci[type=number] { text-align: right; }
.ci:focus { background: var(--adim); border-radius: 2px; }
input[type=number]::-webkit-inner-spin-button { opacity: 0; }

/* result cells */
.rd {
  display: block; text-align: right;
  font-weight: 700; font-size: 13px;
}
.rd.changed { color: var(--warn); }
.rd.ok      { color: var(--ok); }
.rd.empty   { color: var(--muted); font-weight: 400; }

.db { /* del button */
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 16px;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
}
.db:hover { color: var(--danger); }

.empty-row td {
  text-align: center; color: var(--muted);
  font-size: 12px; padding: 32px 0; border-right: none;
}

tfoot td {
  padding: 8px;
  background: var(--bg);
  border-top: 1px solid var(--border2);
  border-right: none;
}

/* ── SUMMARY BAR ── */
.sumbar {
  flex-shrink: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 10px;
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  max-height: 110px; overflow-y: auto;
}
.sum-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-right: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 7px; border-radius: 3px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
  border: 1px solid transparent;
}
.chip-fan  { background: var(--adim); border-color: #2a4a8a; color: #93c5fd; }
.chip-damp { background: var(--wdim); border-color: #5a3a08; color: #fcd34d; }
.chip-ok   { background: var(--okdim); border-color: #0d4020; color: #86efac; }

/* ── BUTTONS ── */
.btn {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  padding: 5px 9px; border-radius: 4px;
  border: 1px solid var(--border2); cursor: pointer;
  background: var(--surface2); color: var(--dim);
  white-space: nowrap; touch-action: manipulation;
  transition: color .1s, background .1s;
}
.btn:active { opacity: .7; }
.btn.p { background: var(--accent); border-color: var(--accent); color: white; }
.btn.d { color: var(--danger); border-color: transparent; background: transparent; padding: 5px 6px; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── PRINT ── */
@media print {
  body, .shell { background: white; color: black; height: auto; overflow: visible; }
  .topbar, .top-actions, .cf-wrap, tfoot, .db, .btn { display: none !important; }
  .table-wrap { overflow: visible; }
  .sumbar { max-height: none; }
  th, td { color: black !important; border-color: #bbb !important; }
  .rd.changed { color: #b45309 !important; }
  .rd.ok      { color: #166534 !important; }
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      🌬
      <span id="brandName">Airflow Balancer</span>
      <span class="brand-sub" id="brandSub">no system</span>
    </div>
    <div class="top-actions">
      <button class="btn" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn" onclick="window.print()">⎙</button>
      <button class="btn d" onclick="clearAll()">✕</button>
    </div>
  </div>

  <div class="settingsbar">
    <div class="sb-field">
      <span class="sb-label">System</span>
      <input class="sb-input sys" id="fanName" type="text" placeholder="AHU-01" oninput="onSysName()">
    </div>
    <div class="sb-field">
      <span class="sb-label">Spd%</span>
      <input class="sb-input spd" id="fanSpeed" type="number" min="0" max="100" value="50" inputmode="numeric" oninput="recalc()">
    </div>
    <div class="rec-box">
      <span class="rec-label">Rec Spd</span>
      <span class="rec-val" id="recSpeed">—</span>
    </div>
    <label class="cf-wrap" title="Correction Factor">
      <input type="checkbox" id="useCF" onchange="onViewChange()">
      <div class="pill"></div>
      <span class="cf-lbl">CF</span>
      <input class="sb-input cf" id="cfVal" type="number" min="0.01" step="0.01" value="1.0" inputmode="decimal" oninput="onViewChange()">
    </label>
    <div class="sb-field" style="margin-left:auto; border-right:none; border-left:1px solid var(--border)">
      <button class="btn p" onclick="addRow()" style="padding:5px 12px">+ Grille</button>
      <button class="btn" onclick="sortRows()" style="margin-left:3px">↕</button>
    </div>
  </div>

  <div class="statsbar">
    <div class="stat">
      <span class="sl">Count</span>
      <span class="sv hi" id="st-n">0</span>
    </div>
    <div class="stat">
      <span class="sl" id="st-cur-lbl">Actual Flow</span>
      <span class="sv" id="st-cur">—</span>
    </div>
    <div class="stat">
      <span class="sl" id="st-req-lbl">Design Req</span>
      <span class="sv" id="st-req">—</span>
    </div>
    <div class="stat">
      <span class="sl">% of Req</span>
      <span class="sv" id="st-pct">—</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="c-idx">
        <col class="c-name">
        <col class="c-req">
        <col class="c-cur">
        <col class="c-damp">
        <col class="c-rec">
        <col class="c-del">
      </colgroup>
      <thead>
        <tr>
          <th class="left">#</th>
          <th class="left">Grille</th>
          <th id="th-req">Req (Design)</th>
          <th id="th-cur">Actual Flow</th>
          <th>Damp%</th>
          <th>Rec%</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="empty-row" id="emptyRow">
          <td colspan="7">Tap + Grille to begin</td>
        </tr>
      </tbody>
      <tfoot>
        <tr><td colspan="7">
          <button class="btn p" onclick="addRow()">+ Add Grille</button>
        </td></tr>
      </tfoot>
    </table>
  </div>

  <div class="sumbar" id="sumbar">
    <span class="sum-lbl">Actions</span>
    <span class="chip chip-ok">✓ Enter data to begin</span>
  </div>

</div>
<script>
let rowCount = 0;
let rowIds = [];

// ── UTILITIES ─────────────────────────────────────────
function fmt(n) { return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1); }
function fmtDec(n) { return Math.round(n * 100) / 100; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── SYSTEM NAME ───────────────────────────────────────
function onSysName() {
  const v = document.getElementById('fanName').value;
  document.getElementById('brandSub').textContent = v || 'no system';
  saveState();
}

// ── CORRECTION FACTOR VIEWS ───────────────────────────
function onViewChange() {
  const useCF = document.getElementById('useCF').checked;
  const cf = parseFloat(document.getElementById('cfVal').value) || 1;

  document.getElementById('cfVal').style.display = useCF ? 'inline-block' : 'none';
  document.getElementById('th-req').textContent = useCF ? 'Target (Req/CF)' : 'Req (Design)';
  document.getElementById('th-cur').textContent = useCF ? 'Raw Hood' : 'Actual (Cur×CF)';

  rowIds.forEach(id => {
    const reqEl = document.getElementById(`rreq-${id}`);
    const curEl = document.getElementById(`rcur-${id}`);

    const rawReq = parseFloat(reqEl.dataset.rawreq);
    const rawCur = parseFloat(curEl.dataset.rawcur);

    if (!isNaN(rawReq)) reqEl.value = useCF ? fmtDec(rawReq / cf) : fmtDec(rawReq);
    if (!isNaN(rawCur)) curEl.value = useCF ? fmtDec(rawCur) : fmtDec(rawCur * cf);
  });

  recalc();
}

// ── CELL INPUT HANDLER ────────────────────────────────
function onCellInput(id, field) {
  const useCF = document.getElementById('useCF').checked;
  const cf = parseFloat(document.getElementById('cfVal').value) || 1;
  const inputEl = document.getElementById(`r${field}-${id}`);
  const valText = inputEl.value;

  if (valText === '') {
    inputEl.dataset[`raw${field}`] = '';
  } else {
    const val = parseFloat(valText);
    if (field === 'req') {
      inputEl.dataset.rawreq = useCF ? (val * cf) : val;
    } else if (field === 'cur') {
      inputEl.dataset.rawcur = useCF ? val : (val / cf);
    }
  }
  recalc();
}

// ── ADD ROW ───────────────────────────────────────────
function addRow(name='', rawReq='', rawCur='', damp='100') {
  rowCount++;
  const id = rowCount;
  rowIds.push(id);
  document.getElementById('emptyRow').style.display = 'none';

  const useCF = document.getElementById('useCF').checked;
  const cf = parseFloat(document.getElementById('cfVal').value) || 1;

  let dispReq = rawReq;
  let dispCur = rawCur;

  if (rawReq !== '') dispReq = useCF ? fmtDec(Number(rawReq) / cf) : fmtDec(Number(rawReq));
  if (rawCur !== '') dispCur = useCF ? fmtDec(Number(rawCur)) : fmtDec(Number(rawCur) * cf);

  const tr = document.createElement('tr');
  tr.id = 'row-' + id;
  tr.innerHTML = `
    <td class="idx" id="idx-${id}">${rowIds.length}</td>
    <td><input class="ci" id="rname-${id}" type="text" placeholder="G${rowIds.length}" value="${esc(name)}" oninput="recalc()"></td>
    <td><input class="ci" id="rreq-${id}" data-rawreq="${rawReq}" type="number" min="0" step="any" inputmode="decimal" value="${dispReq}" oninput="onCellInput(${id}, 'req')"></td>
    <td><input class="ci" id="rcur-${id}" data-rawcur="${rawCur}" type="number" min="0" step="any" inputmode="decimal" value="${dispCur}" oninput="onCellInput(${id}, 'cur')"></td>
    <td><input class="ci" id="rdamp-${id}" type="number" min="0" max="100" inputmode="decimal" value="${damp}" oninput="recalc()"></td>
    <td><span class="rd empty" id="rrec-${id}">—</span></td>
    <td><button class="db" onclick="removeRow(${id})">×</button></td>
  `;
  document.getElementById('tbody').appendChild(tr);
  if (!name) setTimeout(() => document.getElementById('rname-' + id)?.focus(), 30);
  recalc(); 
}

function removeRow(id) {
  rowIds = rowIds.filter(i => i !== id);
  document.getElementById('row-' + id)?.remove();
  if (!rowIds.length) document.getElementById('emptyRow').style.display = '';
  renumber(); recalc();
}

function renumber() {
  rowIds.forEach((id, i) => {
    const el = document.getElementById('idx-' + id);
    if (el) el.textContent = i + 1;
    const ni = document.getElementById('rname-' + id);
    if (ni && !ni.value) ni.placeholder = 'G' + (i + 1);
  });
}

function clearAll() {
  if (!confirm('Clear all data?')) return;
  rowIds.forEach(id => document.getElementById('row-' + id)?.remove());
  rowIds = []; rowCount = 0;
  document.getElementById('emptyRow').style.display = '';
  localStorage.removeItem('aft4');
  recalc();
}

function sortRows() {
  const data = rowIds.map(id => ({
    name: document.getElementById('rname-' + id)?.value ?? '',
    rawReq: document.getElementById('rreq-' + id)?.dataset.rawreq ?? '',
    rawCur: document.getElementById('rcur-' + id)?.dataset.rawcur ?? '',
    damp: document.getElementById('rdamp-' + id)?.value ?? '100',
  }));
  data.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  rowIds.forEach(id => document.getElementById('row-' + id)?.remove());
  rowIds = []; rowCount = 0;
  document.getElementById('emptyRow').style.display = 'none';
  data.forEach(d => addRow(d.name, d.rawReq, d.rawCur, d.damp));
}

// ── RECALCULATE ───────────────────────────────────────
function recalc() {
  const useCF = document.getElementById('useCF').checked;
  const cf = parseFloat(document.getElementById('cfVal').value) || 1;

  let totRawReq = 0, totRawCur = 0;
  const rows = rowIds.map(id => {
    const rawReq = parseFloat(document.getElementById('rreq-' + id)?.dataset.rawreq) || 0;
    const rawCur = parseFloat(document.getElementById('rcur-' + id)?.dataset.rawcur) || 0;
    const damp   = parseFloat(document.getElementById('rdamp-' + id)?.value) || 100;
    
    totRawReq += rawReq;
    totRawCur += rawCur;
    
    return { id, rawReq, rawCur, damp };
  });

  const actualCurSum = totRawCur * cf;
  const curSpeed = parseFloat(document.getElementById('fanSpeed').value) || 0;
  let recSpeed = 0, ratio = 1;

  if (actualCurSum > 0 && totRawReq > 0 && curSpeed > 0) {
    recSpeed = Math.max(0, Math.min(100, Math.round((totRawReq / actualCurSum) * curSpeed)));
    ratio = recSpeed / curSpeed;
  }

  const rsEl = document.getElementById('recSpeed');
  if (actualCurSum > 0 && curSpeed > 0) {
    rsEl.textContent = recSpeed + '%';
    rsEl.className = 'rec-val ' + (recSpeed === curSpeed ? 'ok' : 'changed');
  } else {
    rsEl.textContent = '—';
    rsEl.className = 'rec-val';
  }

  const actions = [];
  if (recSpeed !== curSpeed && actualCurSum > 0 && curSpeed > 0)
    actions.push({ type: 'fan', text: `Fan ${curSpeed}% → ${recSpeed}%` });

  rows.forEach(r => {
    const projActual = r.rawCur * cf * ratio;
    let recD = r.damp;
    if (projActual > 0 && r.rawReq > 0)
      recD = Math.max(0, Math.min(100, Math.round((r.rawReq / projActual) * r.damp)));

    const el = document.getElementById('rrec-' + r.id);
    if (el) {
      if (projActual > 0 && r.rawReq > 0) {
        el.textContent = recD + '%';
        el.className = 'rd ' + (recD !== r.damp ? 'changed' : 'ok');
      } else {
        el.textContent = '—';
        el.className = 'rd empty';
      }
    }

    if (recD !== r.damp && projActual > 0 && r.rawReq > 0) {
      const nm = document.getElementById('rname-' + r.id)?.value || ('#' + r.id);
      actions.push({ type: 'damp', text: `${nm}: ${r.damp}%→${recD}%` });
    }
  });

  // Stats update based on Current View
  const n = rowIds.length;
  document.getElementById('st-n').textContent = n;

  if (useCF) {
    document.getElementById('st-req-lbl').textContent = 'Target Sum';
    document.getElementById('st-cur-lbl').textContent = 'Raw Hood';
    document.getElementById('st-req').textContent = n ? fmt(totRawReq / cf) : '—';
    document.getElementById('st-cur').textContent = n ? fmt(totRawCur) : '—';
  } else {
    document.getElementById('st-req-lbl').textContent = 'Design Sum';
    document.getElementById('st-cur-lbl').textContent = 'Actual Flow';
    document.getElementById('st-req').textContent = n ? fmt(totRawReq) : '—';
    document.getElementById('st-cur').textContent = n ? fmt(actualCurSum) : '—';
  }

  const pctEl = document.getElementById('st-pct');
  if (n && totRawReq > 0) {
    const pct = (actualCurSum / totRawReq) * 100;
    pctEl.textContent = pct.toFixed(1) + '%';
    pctEl.className = 'sv ' + (Math.abs(pct - 100) < 5 ? 'ok' : 'warn');
  } else {
    pctEl.textContent = '—';
    pctEl.className = 'sv';
  }

  // Summary chips
  const bar = document.getElementById('sumbar');
  bar.innerHTML = '<span class="sum-lbl">Actions</span>';
  if (!actions.length) {
    bar.innerHTML += `<span class="chip chip-ok">✓ ${n === 0 ? 'Add grilles to begin' : 'System balanced'}</span>`;
  } else {
    actions.forEach(a => {
      bar.innerHTML += `<span class="chip ${a.type === 'fan' ? 'chip-fan' : 'chip-damp'}">${a.type === 'fan' ? '⚡' : '🔧'} ${a.text}</span>`;
    });
  }

  saveState();
}

// ── SAVE / LOAD ───────────────────────────────────────
function saveState() {
  localStorage.setItem('aft4', JSON.stringify({
    fanName:  document.getElementById('fanName').value,
    fanSpeed: document.getElementById('fanSpeed').value,
    useCF:    document.getElementById('useCF').checked,
    cfVal:    document.getElementById('cfVal').value,
    rows: rowIds.map(id => ({
      name:   document.getElementById('rname-' + id)?.value ?? '',
      rawReq: document.getElementById('rreq-' + id)?.dataset.rawreq ?? '',
      rawCur: document.getElementById('rcur-' + id)?.dataset.rawcur ?? '',
      damp:   document.getElementById('rdamp-' + id)?.value ?? '100',
    }))
  }));
}

function loadState() {
  const raw = localStorage.getItem('aft4') || localStorage.getItem('aft3');
  if (!raw) { recalc(); return; }
  try {
    const s = JSON.parse(raw);
    document.getElementById('fanName').value  = s.fanName  || '';
    document.getElementById('fanSpeed').value = s.fanSpeed || 50;
    document.getElementById('useCF').checked  = !!s.useCF;
    document.getElementById('cfVal').value    = s.cfVal    || 1.0;
    onSysName();

    document.getElementById('cfVal').style.display = s.useCF ? 'inline-block' : 'none';
    document.getElementById('th-req').textContent = s.useCF ? 'Target (Req/CF)' : 'Req (Design)';
    document.getElementById('th-cur').textContent = s.useCF ? 'Raw Hood' : 'Actual (Cur×CF)';

    (s.rows || s.grilles || []).forEach(r => {
      const rawReq = r.rawReq !== undefined ? r.rawReq : (r.req || r.required || '');
      const rawCur = r.rawCur !== undefined ? r.rawCur : (r.cur || r.current || '');
      addRow(r.name || r.label || '', rawReq, rawCur, r.damp || r.damper || '100');
    });
  } catch(e) { console.warn('load failed', e); }
  recalc();
}

// ── EXPORT CSV ────────────────────────────────────────
function exportCSV() {
  const useCF   = document.getElementById('useCF').checked;
  const cf      = useCF ? (parseFloat(document.getElementById('cfVal').value) || 1) : 1;
  const sysName = document.getElementById('fanName').value || 'System';
  const speed   = document.getElementById('fanSpeed').value;
  const date    = new Date().toLocaleDateString();

  let totRawReq = 0, totRawCur = 0;
  const data = rowIds.map((id, i) => {
    const name = document.getElementById('rname-' + id)?.value || '';
    const damp = parseFloat(document.getElementById('rdamp-' + id)?.value) || 100;
    const rawReq = parseFloat(document.getElementById('rreq-' + id)?.dataset.rawreq) || 0;
    const rawCur = parseFloat(document.getElementById('rcur-' + id)?.dataset.rawcur) || 0;
    
    totRawReq += rawReq;
    totRawCur += rawCur;
    
    return { i: i+1, name, rawReq, rawCur, damp };
  });

  const actualCurSum = totRawCur * cf;
  const curSpeed = parseFloat(speed) || 0;
  let recSpeed = 0, ratio = 1;
  
  if (actualCurSum > 0 && totRawReq > 0 && curSpeed > 0) {
    recSpeed = Math.max(0, Math.min(100, Math.round((totRawReq / actualCurSum) * curSpeed)));
    ratio = recSpeed / curSpeed;
  }

  const headers = ['#','Grille','Design Flow','Target Hood','Raw Hood','Actual Flow','Cur Damp%','Rec Damp%'];

  const csvRows = [
    [`Airflow Balancing Report — ${sysName} — ${date}`],
    [`Fan Speed: ${speed}%`, `Recommended: ${recSpeed}%`, `Correction Factor: ${cf}`],
    [],
    headers,
    ...data.map(r => {
      const projActual = r.rawCur * cf * ratio;
      let recD = r.damp;
      if (projActual > 0 && r.rawReq > 0) recD = Math.max(0, Math.min(100, Math.round((r.rawReq / projActual) * r.damp)));
      
      return [
        r.i, r.name, 
        r.rawReq, 
        fmtDec(r.rawReq / cf), 
        r.rawCur, 
        fmtDec(r.rawCur * cf), 
        r.damp + '%', recD + '%'
      ];
    }),
    [],
    ['Totals', '', fmt(totRawReq), fmtDec(totRawReq/cf), fmt(totRawCur), fmt(actualCurSum)]
  ];

  const csv = csvRows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `airflow-${sysName.replace(/\s+/g,'-').toLowerCase()}-${date.replace(/\//g,'-')}.csv`;
  a.click();
}

window.onload = loadState;
</script>
