<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Airflow Balancing Tool</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1e2330;
  --border: #2a2f3f;
  --border2: #3a3f52;
  --text: #e8eaf0;
  --text-dim: #8890a8;
  --text-muted: #555e78;
  --accent: #3b82f6;
  --accent-dim: #1e3a6e;
  --warn: #f59e0b;
  --warn-dim: #3d2e0a;
  --ok: #22c55e;
  --ok-dim: #0c2e18;
  --danger: #ef4444;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Sora', sans-serif;
  --row-h: 34px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  overflow-x: hidden;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-height: 100vh;
}

/* TOPBAR */
.topbar {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  height: 44px;
  overflow-x: auto;
}
.topbar-brand {
  padding: 0 14px;
  border-right: 1px solid var(--border);
  height: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand-name {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
}
.tb-field {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 10px;
  border-right: 1px solid var(--border);
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.tb-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.tb-input {
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  width: 110px;
  outline: none;
}
.tb-input.narrow { width: 44px; text-align: center; }
.tb-input:focus { color: var(--accent); }

.rec-speed-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 12px;
  border-right: 1px solid var(--border);
  height: 100%;
  gap: 1px;
  flex-shrink: 0;
}
.rec-speed-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.rec-speed-val { font-size: 14px; font-weight: 700; color: var(--text-dim); }
.rec-speed-val.changed { color: var(--warn); }
.rec-speed-val.ok { color: var(--ok); }

.cf-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-right: 1px solid var(--border);
  height: 100%;
  cursor: pointer;
  flex-shrink: 0;
}
.cf-toggle input[type=checkbox] { display: none; }
.cf-pill {
  width: 28px; height: 15px;
  background: var(--border2);
  border-radius: 8px;
  position: relative;
  transition: background 0.15s;
  flex-shrink: 0;
}
.cf-pill::after {
  content: '';
  position: absolute;
  width: 11px; height: 11px;
  background: var(--text-muted);
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform 0.15s, background 0.15s;
}
input:checked ~ .cf-pill { background: var(--accent-dim); }
input:checked ~ .cf-pill::after { transform: translateX(13px); background: var(--accent); }
.cf-label { font-size: 11px; color: var(--text-muted); }
.cf-num {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  width: 50px;
  padding: 2px 4px;
  border-radius: 3px;
  text-align: center;
  outline: none;
  display: none;
}
.cf-num:focus { border-color: var(--accent); }

.topbar-actions {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 8px;
  gap: 4px;
  margin-left: auto;
  flex-shrink: 0;
}

/* BUTTONS */
.btn {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  cursor: pointer;
  background: var(--surface2);
  color: var(--text-dim);
  transition: all 0.12s;
  white-space: nowrap;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { color: var(--text); background: var(--surface); }
.btn:active { opacity: 0.7; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: #2563eb; }
.btn.ghost-danger { color: var(--danger); border-color: transparent; background: transparent; }

/* STATS BAR */
.statsbar {
  flex-shrink: 0;
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.stat {
  flex: 1;
  min-width: 90px;
  padding: 5px 12px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat:last-child { border-right: none; }
.stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
.stat-value { font-size: 15px; font-weight: 700; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.stat-value.ok { color: var(--ok); }
.stat-value.warn { color: var(--warn); }
.stat-value.accent { color: var(--accent); }

/* TABLE */
.table-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  min-width: 540px;
  border-collapse: collapse;
  table-layout: fixed;
}

col.c-num  { width: 34px; }
col.c-name { width: 130px; }
col.c-num3 { width: 78px; }
col.c-damp { width: 70px; }
col.c-rdamp{ width: 70px; }
col.c-pct  { width: 62px; }
col.c-del  { width: 32px; }

thead {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface2);
  border-bottom: 1px solid var(--border2);
}
th {
  padding: 0 7px;
  height: 27px;
  text-align: left;
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  white-space: nowrap;
  border-right: 1px solid var(--border);
}
th:last-child { border-right: none; }

tbody tr {
  border-bottom: 1px solid var(--border);
  height: var(--row-h);
}
tbody tr:hover { background: var(--surface2); }

td {
  padding: 0 5px;
  height: var(--row-h);
  border-right: 1px solid var(--border);
  vertical-align: middle;
  white-space: nowrap;
}
td:last-child { border-right: none; }

.td-num { color: var(--text-muted); font-size: 10px; text-align: center; }

.cell-input {
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  width: 100%;
  height: 100%;
  outline: none;
  padding: 0 2px;
}
.cell-input:focus { background: var(--accent-dim); border-radius: 3px; }
.cell-input[type="number"] { text-align: right; }
input[type=number]::-webkit-inner-spin-button { opacity: 0; }

.rec-damper { font-weight: 700; font-size: 13px; text-align: right; display: block; }
.rec-damper.changed { color: var(--warn); }
.rec-damper.ok      { color: var(--ok); }
.rec-damper.empty   { color: var(--text-muted); }

.pct-cell { color: var(--text-dim); text-align: right; font-size: 12px; display: block; }

.del-btn {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer; font-size: 16px;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.del-btn:hover { color: var(--danger); }

tfoot td {
  padding: 6px 8px;
  background: var(--bg);
  border-top: 1px solid var(--border2);
  border-right: none;
}

/* SUMMARY */
.summary-panel {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--surface);
  max-height: 120px;
  overflow-y: auto;
}
.summary-inner {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 7px 10px;
  align-items: center;
}
.summary-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text-muted);
  margin-right: 2px; white-space: nowrap;
}
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 7px; border-radius: 3px;
  font-size: 11px; font-weight: 500;
  white-space: nowrap; border: 1px solid transparent;
}
.chip-fan  { background: var(--accent-dim); border-color: #2a4a8a; color: #93c5fd; }
.chip-damp { background: var(--warn-dim); border-color: #5a3a08; color: #fcd34d; }
.chip-ok   { background: var(--ok-dim); border-color: #0d4020; color: #86efac; }

/* EMPTY */
.empty-row td { text-align: center; color: var(--text-muted); font-size: 12px; padding: 30px; border-right: none; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media print {
  .topbar-actions, tfoot, .del-btn { display: none !important; }
  body, .shell { background: white; color: black; height: auto; }
  .table-wrap { overflow: visible; }
  .summary-panel { max-height: none; }
  th, td { color: black !important; border-color: #bbb !important; }
  .rec-damper.changed { color: #b45309 !important; }
  .rec-damper.ok { color: #166534 !important; }
}
</style>
</head>
<body>
<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <span>🌬</span>
      <span class="brand-name">Airflow Balancer</span>
    </div>
    <div class="tb-field">
      <span class="tb-label">System</span>
      <input class="tb-input" id="fanName" type="text" placeholder="AHU-01" oninput="saveState()">
    </div>
    <div class="tb-field">
      <span class="tb-label">Speed %</span>
      <input class="tb-input narrow" id="fanSpeed" type="number" min="0" max="100" value="50" oninput="recalc()">
    </div>
    <div class="rec-speed-wrap">
      <span class="rec-speed-label">Rec. Speed</span>
      <span class="rec-speed-val" id="recSpeed">—</span>
    </div>
    <label class="cf-toggle" title="Correction Factor">
      <input type="checkbox" id="useCF" onchange="toggleCF()">
      <div class="cf-pill"></div>
      <span class="cf-label">CF</span>
      <input class="cf-num" id="cfVal" type="number" min="0.01" step="0.01" value="1.0" oninput="recalc()">
    </label>
    <div class="topbar-actions">
      <button class="btn primary" onclick="addRow()">+ Grille</button>
      <button class="btn" onclick="sortRows()">↕ Sort</button>
      <button class="btn" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn" onclick="window.print()">⎙ PDF</button>
      <button class="btn ghost-danger" onclick="clearAll()">✕</button>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="statsbar">
    <div class="stat">
      <span class="stat-label">Grilles</span>
      <span class="stat-value accent" id="st-count">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Cur Flow</span>
      <span class="stat-value" id="st-cur">—</span>
    </div>
    <div class="stat" id="st-corr-box" style="display:none">
      <span class="stat-label">Corr Flow</span>
      <span class="stat-value" id="st-corr">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Req Flow</span>
      <span class="stat-value" id="st-req">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">% of Req</span>
      <span class="stat-value" id="st-pct">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Avg/Grille</span>
      <span class="stat-value" id="st-avg">—</span>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="c-num">
        <col class="c-name">
        <col class="c-num3">
        <col class="c-num3">
        <col class="c-num3" id="col-corr" style="display:none">
        <col class="c-damp">
        <col class="c-rdamp">
        <col class="c-pct">
        <col class="c-del">
      </colgroup>
      <thead>
        <tr>
          <th>#</th>
          <th>Grille</th>
          <th style="text-align:right">Req Flow</th>
          <th style="text-align:right">Cur Flow</th>
          <th id="th-corr" style="display:none;text-align:right">Corr Flow</th>
          <th style="text-align:right">Cur Damp%</th>
          <th style="text-align:right">Rec Damp%</th>
          <th style="text-align:right">% Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="empty-row" id="emptyRow">
          <td colspan="9">No grilles yet — click + Grille to add one</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="9">
            <button class="btn primary" onclick="addRow()">+ Add Grille</button>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- SUMMARY -->
  <div class="summary-panel">
    <div class="summary-inner" id="summaryInner">
      <span class="summary-label">Actions</span>
      <span class="chip chip-ok">✓ Enter data to see recommendations</span>
    </div>
  </div>

</div>
<script>
let rowCount = 0;
let rowIds = [];

function toggleCF() {
  const on = document.getElementById('useCF').checked;
  document.getElementById('cfVal').style.display = on ? 'inline-block' : 'none';
  document.getElementById('col-corr').style.display = on ? '' : 'none';
  document.getElementById('th-corr').style.display = on ? '' : 'none';
  document.getElementById('st-corr-box').style.display = on ? '' : 'none';
  rowIds.forEach(id => {
    const el = document.getElementById('td-corr-' + id);
    if (el) el.style.display = on ? '' : 'none';
  });
  recalc(); saveState();
}

function addRow(name='', req='', cur='', damp='100') {
  rowCount++;
  const id = rowCount;
  rowIds.push(id);
  document.getElementById('emptyRow').style.display = 'none';
  const useCF = document.getElementById('useCF').checked;
  const tr = document.createElement('tr');
  tr.id = 'row-' + id;
  tr.innerHTML = `
    <td class="td-num">${rowIds.length}</td>
    <td><input class="cell-input" id="rname-${id}" type="text" placeholder="G${rowIds.length}" value="${esc(name)}" oninput="recalc()"></td>
    <td><input class="cell-input" id="rreq-${id}" type="number" min="0" step="any" inputmode="decimal" value="${req}" oninput="recalc()" style="text-align:right"></td>
    <td><input class="cell-input" id="rcur-${id}" type="number" min="0" step="any" inputmode="decimal" value="${cur}" oninput="recalc()" style="text-align:right"></td>
    <td id="td-corr-${id}" style="display:${useCF?'':'none'};text-align:right"><span id="corr-${id}" style="font-size:12px;color:var(--text-dim);display:block;text-align:right">—</span></td>
    <td><input class="cell-input" id="rdamp-${id}" type="number" min="0" max="100" inputmode="decimal" value="${damp}" oninput="recalc()" style="text-align:right"></td>
    <td style="text-align:right"><span class="rec-damper empty" id="rdampval-${id}">—</span></td>
    <td style="text-align:right"><span class="pct-cell" id="pctval-${id}">—</span></td>
    <td><button class="del-btn" onclick="removeRow(${id})">×</button></td>
  `;
  document.getElementById('tbody').appendChild(tr);
  if (!name) setTimeout(() => document.getElementById('rname-' + id)?.focus(), 30);
  recalc(); saveState();
}

function removeRow(id) {
  rowIds = rowIds.filter(i => i !== id);
  document.getElementById('row-' + id)?.remove();
  if (rowIds.length === 0) document.getElementById('emptyRow').style.display = '';
  renumber(); recalc(); saveState();
}

function renumber() {
  rowIds.forEach((id, i) => {
    const n = document.querySelector('#row-' + id + ' .td-num');
    if (n) n.textContent = i + 1;
  });
}

function clearAll() {
  if (!confirm('Clear all data?')) return;
  rowIds.forEach(id => document.getElementById('row-' + id)?.remove());
  rowIds = []; rowCount = 0;
  document.getElementById('emptyRow').style.display = '';
  localStorage.removeItem('aft3');
  recalc();
}

function sortRows() {
  const data = rowIds.map(id => ({
    name: document.getElementById('rname-' + id)?.value ?? '',
    req:  document.getElementById('rreq-' + id)?.value ?? '',
    cur:  document.getElementById('rcur-' + id)?.value ?? '',
    damp: document.getElementById('rdamp-' + id)?.value ?? '100',
  }));
  data.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  rowIds.forEach(id => document.getElementById('row-' + id)?.remove());
  rowIds = []; rowCount = 0;
  document.getElementById('emptyRow').style.display = 'none';
  data.forEach(d => addRow(d.name, d.req, d.cur, d.damp));
}

function recalc() {
  const useCF = document.getElementById('useCF').checked;
  const cf = useCF ? (parseFloat(document.getElementById('cfVal').value) || 1) : 1;

  let totCur = 0, totCorr = 0, totReq = 0;
  const rows = rowIds.map(id => {
    const cur  = parseFloat(document.getElementById('rcur-' + id)?.value)  || 0;
    const req  = parseFloat(document.getElementById('rreq-' + id)?.value)  || 0;
    const damp = parseFloat(document.getElementById('rdamp-' + id)?.value) || 100;
    const corr = cur * cf;
    totCur += cur; totCorr += corr; totReq += req;
    return { id, cur, req, damp, corr };
  });

  const effTotal = useCF ? totCorr : totCur;
  const curSpeed = parseFloat(document.getElementById('fanSpeed').value) || 0;
  let recSpeed = 0, ratio = 1;
  if (effTotal > 0 && totReq > 0 && curSpeed > 0) {
    recSpeed = Math.max(0, Math.min(100, Math.round((totReq / effTotal) * curSpeed)));
    ratio = recSpeed / curSpeed;
  }

  const rsEl = document.getElementById('recSpeed');
  if (effTotal > 0 && curSpeed > 0) {
    rsEl.textContent = recSpeed + '%';
    rsEl.className = 'rec-speed-val ' + (recSpeed === curSpeed ? 'ok' : 'changed');
  } else { rsEl.textContent = '—'; rsEl.className = 'rec-speed-val'; }

  const actions = [];
  if (recSpeed !== curSpeed && effTotal > 0 && curSpeed > 0)
    actions.push({ type: 'fan', text: `Fan: ${curSpeed}% → ${recSpeed}%` });

  rows.forEach(r => {
    const eff = useCF ? r.corr : r.cur;
    const proj = eff * ratio;
    let recD = r.damp;
    if (proj > 0 && r.req > 0)
      recD = Math.max(0, Math.min(100, Math.round((r.req / proj) * r.damp)));

    const corrEl = document.getElementById('corr-' + r.id);
    if (corrEl) corrEl.textContent = useCF ? r.corr.toFixed(1) : '—';

    const rdEl = document.getElementById('rdampval-' + r.id);
    if (rdEl) {
      if (proj > 0) { rdEl.textContent = recD + '%'; rdEl.className = 'rec-damper ' + (recD !== r.damp ? 'changed' : 'ok'); }
      else { rdEl.textContent = '—'; rdEl.className = 'rec-damper empty'; }
    }

    const pctEl = document.getElementById('pctval-' + r.id);
    if (pctEl) pctEl.textContent = effTotal > 0 ? (eff / effTotal * 100).toFixed(1) + '%' : '—';

    if (recD !== r.damp && proj > 0) {
      const nm = document.getElementById('rname-' + r.id)?.value || ('#' + r.id);
      actions.push({ type: 'damp', text: `${nm}: ${r.damp}% → ${recD}%` });
    }
  });

  const n = rowIds.length;
  document.getElementById('st-count').textContent = n;
  document.getElementById('st-cur').textContent  = n ? fmt(totCur)  : '—';
  document.getElementById('st-corr').textContent = n ? fmt(totCorr) : '—';
  document.getElementById('st-req').textContent  = n ? fmt(totReq)  : '—';
  const pctReq = (totReq > 0 && effTotal > 0) ? (effTotal / totReq * 100) : null;
  const pEl = document.getElementById('st-pct');
  pEl.textContent = pctReq !== null ? pctReq.toFixed(1) + '%' : '—';
  pEl.className = 'stat-value' + (pctReq === null ? '' : Math.abs(pctReq - 100) < 5 ? ' ok' : ' warn');
  document.getElementById('st-avg').textContent = (n && effTotal) ? fmt(effTotal / n) : '—';

  const inner = document.getElementById('summaryInner');
  inner.innerHTML = '<span class="summary-label">Actions</span>';
  if (!actions.length) {
    inner.innerHTML += `<span class="chip chip-ok">✓ ${n === 0 ? 'Add grilles to begin' : 'System balanced'}</span>`;
  } else {
    actions.forEach(a => {
      inner.innerHTML += `<span class="chip ${a.type === 'fan' ? 'chip-fan' : 'chip-damp'}">${a.type === 'fan' ? '⚡' : '🔧'} ${a.text}</span>`;
    });
  }
  saveState();
}

function saveState() {
  const s = {
    fanName: document.getElementById('fanName').value,
    fanSpeed: document.getElementById('fanSpeed').value,
    useCF: document.getElementById('useCF').checked,
    cfVal: document.getElementById('cfVal').value,
    rows: rowIds.map(id => ({
      name: document.getElementById('rname-' + id)?.value ?? '',
      req:  document.getElementById('rreq-' + id)?.value ?? '',
      cur:  document.getElementById('rcur-' + id)?.value ?? '',
      damp: document.getElementById('rdamp-' + id)?.value ?? '100',
    }))
  };
  localStorage.setItem('aft3', JSON.stringify(s));
}

function loadState() {
  const raw = localStorage.getItem('aft3')
    || localStorage.getItem('airflowToolState2')
    || localStorage.getItem('airflowToolState');
  if (!raw) { recalc(); return; }
  try {
    const s = JSON.parse(raw);
    document.getElementById('fanName').value  = s.fanName  || '';
    document.getElementById('fanSpeed').value = s.fanSpeed || 50;
    document.getElementById('useCF').checked  = !!s.useCF;
    document.getElementById('cfVal').value    = s.cfVal    || 1.0;
    if (s.useCF) toggleCF();
    (s.rows || s.grilles || []).forEach(r =>
      addRow(r.name || r.label || '', r.req || r.required || '', r.cur || r.current || '', r.damp || r.damper || '100')
    );
  } catch(e) {}
  recalc();
}

function exportCSV() {
  const useCF = document.getElementById('useCF').checked;
  const cf    = useCF ? (parseFloat(document.getElementById('cfVal').value) || 1) : 1;
  const name  = document.getElementById('fanName').value || 'System';
  const speed = document.getElementById('fanSpeed').value;
  const date  = new Date().toLocaleDateString();

  let totCur = 0, totCorr = 0, totReq = 0;
  const data = rowIds.map((id, i) => {
    const n = document.getElementById('rname-' + id)?.value || '';
    const req  = parseFloat(document.getElementById('rreq-' + id)?.value)  || 0;
    const cur  = parseFloat(document.getElementById('rcur-' + id)?.value)  || 0;
    const damp = parseFloat(document.getElementById('rdamp-' + id)?.value) || 100;
    const corr = cur * cf;
    totCur += cur; totCorr += corr; totReq += req;
    return { i: i+1, n, req, cur, damp, corr };
  });

  const effTotal = useCF ? totCorr : totCur;
  const curSpeed = parseFloat(speed) || 0;
  let recSpeed = 0, ratio = 1;
  if (effTotal > 0 && totReq > 0 && curSpeed > 0) {
    recSpeed = Math.max(0, Math.min(100, Math.round((totReq / effTotal) * curSpeed)));
    ratio = recSpeed / curSpeed;
  }

  const hdrs = ['#','Grille','Req Flow','Cur Flow',...(useCF?['Corr Flow']:[]),'Cur Damp%','Rec Damp%','% Total'];
  const csvRows = [
    [`Airflow Balancing Report — ${name} — ${date}`],
    [`Fan Speed: ${speed}%`, `Recommended: ${recSpeed}%`, useCF ? `CF: ${cf}` : ''].filter(Boolean),
    [],
    hdrs,
    ...data.map(r => {
      const proj = (useCF ? r.corr : r.cur) * ratio;
      let recD = r.damp;
      if (proj > 0 && r.req > 0) recD = Math.max(0, Math.min(100, Math.round((r.req / proj) * r.damp)));
      const pct = effTotal > 0 ? ((useCF ? r.corr : r.cur) / effTotal * 100).toFixed(1) + '%' : '—';
      return [r.i, r.n, r.req, r.cur, ...(useCF ? [r.corr.toFixed(2)] : []), r.damp + '%', recD + '%', pct];
    }),
    [],
    ['Totals','', fmt(totCur), ...(useCF ? [fmt(totCorr)] : []),'','',''],
    ['Required','', fmt(totReq)],
  ];

  const csv = csvRows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `airflow-${name.replace(/\s+/g,'-').toLowerCase()}-${date.replace(/\//g,'-')}.csv`;
  a.click();
}

function fmt(n) { return n % 1 === 0 ? n.toFixed(0) : n.toFixed(1); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

window.onload = loadState;
</script>
